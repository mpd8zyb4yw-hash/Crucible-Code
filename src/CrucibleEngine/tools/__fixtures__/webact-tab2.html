<!doctype html>
<!-- The target of the fixture's new-tab link. A separate FILE rather than a data: URL, because
     Chromium blocks top-level navigation to data: — the first attempt at this test opened
     nothing at all and looked like a bug in tab adoption. -->
<html lang="en">
<head><meta charset="utf-8"><title>Second Tab</title></head>
<body>
  <h1>Second Tab</h1>
  <p>This page only exists in the tab that the link opened.</p>
  <button id="tab2-btn">In the new tab</button>
</body>
</html>
